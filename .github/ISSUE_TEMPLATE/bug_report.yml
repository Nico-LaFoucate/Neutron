name: Bug report
description: An Adobe app won't launch or misbehaves while running, or the neutron CLI doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This form is for launching and running the Adobe apps, and for the `neutron` CLI (setup, update, uninstall, prefixes).
        Problems with the Collider app itself, with installing an app (Mud Hut) or with the neutron-wine runtime go to those repositories' Issues.
        Please report one bug per issue. Questions go to [Discussions](https://github.com/Nico-LaFoucate/Neutron/discussions).
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Which app were you using when it happened?
      options:
        - Premiere Pro
        - After Effects
        - Photoshop
        - Lightroom Classic
        - Illustrator
        - Media Encoder
        - Animate
        - Lightroom (cloud, experimental)
        - Audition (experimental)
        - InDesign (experimental)
        - neutron setup, update or uninstall
        - Other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The Adobe app's version or release year, if it's an Adobe app.
      placeholder: e.g. Premiere Pro 2025
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. For anything visual, a screenshot or screen recording helps.
    validations:
      required: true
  - type: textarea
    id: neutron-report
    attributes:
      label: neutron report
      description: Run `neutron report` and paste everything it prints. If the problem is in one app, run `neutron report --app <app>` instead (for example `--app premiere`), so the log at the end is that app's. It replaces your user name, home folder and sign-in details with placeholders; read it before you post. On a Neutron older than 1.0.0-beta.27, paste what `neutron --version` and `neutron doctor --prefix <your prefix>` print instead.
      render: text
    validations:
      required: true
